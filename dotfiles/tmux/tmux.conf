# ~/.tmux.conf - Tmux Configuration with Catppuccin Theme

# ============================================================================
# General Settings
# ============================================================================

# Enable mouse support (disable if you want right-click context menu to work)
set -g mouse off

# Set default terminal to support 256 colors
set -g default-terminal "tmux-256color"

# Enable true color support
set -ga terminal-overrides ",xterm-256color:Tc"

# Start window numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size
set -g history-limit 10000

# Enable focus events
set -g focus-events on

# Reduce escape time for better vim experience
set -sg escape-time 10

# ============================================================================
# Catppuccin Theme Configuration
# ============================================================================

# Set the Catppuccin flavor (latte, frappe, macchiato, or mocha)
set -g @catppuccin_flavor 'mocha'

# Window status style
set -g @catppuccin_window_status_style 'rounded'

# Load the Catppuccin theme FIRST (this sets default Nerd Font icons)
run ~/dev/dev-setup/dotfiles/tmux/plugins/catppuccin/catppuccin.tmux

# ============================================================================
# Status Line Configuration
# ============================================================================

# Increase status line length
set -g status-right-length 100
set -g status-left-length 100

# Clear default status
set -g status-left ""

# Configure status modules (will use Nerd Font icons from theme)
set -g status-right "#{b:pane_current_path}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ============================================================================
# Key Bindings
# ============================================================================

# Reload configuration
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Keep the default split bindings you're used to
bind '"' split-window -v    # Ctrl+b " splits vertically (top/bottom)
bind % split-window -h      # Ctrl+b % splits horizontally (side by side)

# Alternative bindings (in addition to defaults)
bind | split-window -h      # Ctrl+b | also splits horizontally
bind - split-window -v      # Ctrl+b - also splits vertically

# Switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ============================================================================
# Copy/Paste Configuration
# ============================================================================

# Use vi mode for copy mode
setw -g mode-keys vi

# Enter copy mode with Ctrl+b [
bind [ copy-mode

# Vi-style copy/paste key bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

# Mouse drag in copy mode: begin selection and follow the drag
bind -T copy-mode-vi MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy"

# Paste with Ctrl+b ]
bind ] run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# Alternative paste with Ctrl+b p
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

